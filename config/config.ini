# Leti Cook collection settings. Contains no passwords or API keys.
# Limits apply to the next worker run; no restart is needed.
# Restart the backend after changing youtube_request_concurrency.
# Limits bound one pass or chunk, not the total channel/video library.
[format]
version = 3

[collection]
# false pauses collection. Required data maintenance continues.
automatic_collection = true
# Automatic pass interval in minutes: 6, 10, 15, 20 or 30.
interval_minutes = 30
# Seconds to finish the current work unit at a scheduled handoff: 10..600.
handoff_grace_seconds = 120
# Per-manual-statistics-job admission bound, 1..1000000; not daily Google quota.
manual_stats_quota_units = 200
# Maximum simultaneous YouTube requests across the application: 1..50.
# Applies after restart. Start with 8; increase only after measuring.
youtube_request_concurrency = 8

[limits]
# Channels whose YouTube metadata is refreshed per automatic pass: 0..100000. 0 disables this phase; it is not unlimited.
metadata_limit = 1000
# YouTube playlist page attempts per automatic pass, all three types together: 0..100000. 0 disables this phase; it is not unlimited.
inventory_page_budget = 20000
# Videos selected for General or Stats per automatic pass, all types together: 1..100000.
stats_limit = 20000
# Deprecated collection limit; caps the in-memory sample of newly found IDs only (must not exceed stats_limit): 0..100000. 0 disables the sample, never collection.
new_video_stats_limit = 2500
# Videos processed per job chunk: 1..250.
operator_chunk_size = 50
# Playlist pages processed per inventory chunk: 1..10.
inventory_pages_per_chunk = 5
# Maximum job chunks per worker pass: 1..512.
drain_max_chunks = 128
# Maximum worker-pass time budget in seconds: 1..1200.
drain_max_seconds = 900
