# Nonsecret collection intervals. Changes apply after backend restart.
# Keep the nearest scheduled refresh; its next interval uses the new values.
# Age bands, request modes and quota policy are not configurable here.
# Refresh intervals: whole seconds, 1..2419200. Unavailable stop: at most 2505600.
# Typed jitter: 0..both typed metadata intervals. Existing version 2/3 files remain readable.
[format]
version = 4

[schedule.long.counters]
age_0_1d_seconds = 3600
age_1_7d_seconds = 7200
age_7_28d_seconds = 21600
age_28_90d_seconds = 43200
age_90_365d_seconds = 86400
age_365d_plus_seconds = 604800
unlisted_seconds = 2419200

[schedule.long.metadata]
age_0_7d_seconds = 21600
age_7_28d_seconds = 86400
age_28_365d_seconds = 604800
age_365d_plus_seconds = 2419200
unlisted_seconds = 2419200

[schedule.short.metadata]
age_through_90d_seconds = 604800
age_over_90d_seconds = 2419200
jitter_seconds = 21600

[schedule.stream.metadata]
age_through_90d_seconds = 604800
age_over_90d_seconds = 2419200
jitter_seconds = 21600

[schedule.rechecks]
# Legacy version 2 setting retained for configuration compatibility.
# New unavailable episodes use the per-type sections below.
unavailable_long_max_seconds = 2419200
# Retry retained video identities whose API data has been cleared.
identity_seconds = 2419200

[schedule.short.counters]
age_0_1d_seconds = 3600
age_1_7d_seconds = 7200
age_7_28d_seconds = 21600
age_28_90d_seconds = 43200
age_90_365d_seconds = 86400
age_365d_plus_seconds = 604800
unlisted_seconds = 2419200

[schedule.stream.counters]
age_0_1d_seconds = 3600
age_1_7d_seconds = 7200
age_7_28d_seconds = 21600
age_28_90d_seconds = 43200
age_90_365d_seconds = 86400
age_365d_plus_seconds = 604800
unlisted_seconds = 2419200

# A confirmed missing response starts one episode; later misses do not restart it.
# At the stop deadline no provider request is made. This is not API-data retention.
[schedule.long.unavailable]
daily_seconds = 86400
daily_window_seconds = 604800
weekly_seconds = 604800
stop_after_seconds = 2505600

[schedule.short.unavailable]
daily_seconds = 86400
daily_window_seconds = 604800
weekly_seconds = 604800
stop_after_seconds = 2505600

[schedule.stream.unavailable]
daily_seconds = 86400
daily_window_seconds = 604800
weekly_seconds = 604800
stop_after_seconds = 2505600

# Playlist discovery and full-list reconciliation. These values do not enable
# disabled work or change initial loading, scan receipts, quota or leases.
# Only discovery_continuation_seconds accepts 0 (no additional delay).
# Quiet and error ladders must not decrease. Existing due times stay assigned.
[schedule.long.inventory]
missing_playlist_seconds = 86400
found_new_seconds = 3600
discovery_continuation_seconds = 1800
reconciliation_seconds = 1814400
quiet_1_seconds = 7200
quiet_2_seconds = 14400
quiet_3_seconds = 28800
quiet_4_seconds = 28800
quiet_5_seconds = 28800
quiet_6_plus_seconds = 86400
error_0_seconds = 3600
error_1_seconds = 7200
error_2_seconds = 14400
error_3_seconds = 28800
error_4_seconds = 57600
error_5_plus_seconds = 86400

[schedule.short.inventory]
missing_playlist_seconds = 1814400
found_new_seconds = 3600
discovery_continuation_seconds = 0
reconciliation_seconds = 1814400
quiet_1_seconds = 7200
quiet_2_seconds = 14400
quiet_3_seconds = 28800
quiet_4_seconds = 86400
quiet_5_seconds = 86400
quiet_6_plus_seconds = 86400
error_0_seconds = 3600
error_1_seconds = 3600
error_2_seconds = 7200
error_3_seconds = 14400
error_4_seconds = 28800
error_5_plus_seconds = 86400

[schedule.stream.inventory]
missing_playlist_seconds = 1814400
found_new_seconds = 3600
discovery_continuation_seconds = 0
reconciliation_seconds = 1814400
quiet_1_seconds = 7200
quiet_2_seconds = 14400
quiet_3_seconds = 28800
quiet_4_seconds = 86400
quiet_5_seconds = 86400
quiet_6_plus_seconds = 86400
error_0_seconds = 3600
error_1_seconds = 3600
error_2_seconds = 7200
error_3_seconds = 14400
error_4_seconds = 28800
error_5_plus_seconds = 86400
