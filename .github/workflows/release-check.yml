name: Delivery checks
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  REGISTRY_IMAGE: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
jobs:
  prepare:
    name: Signed delivery dry run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked release tooling
        run: |
          python -m pip install --require-hashes --no-deps -r application/requirements.lock
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo
      - name: Capture the verified source bundle
        run: python -B tools/package_release.py --output "$RUNNER_TEMP/release-bundle"
      - name: Verify Chromium extension packaging without publication
        run: python -B tools/package_extension.py --output "$RUNNER_TEMP/extension-preview"
      - name: Create isolated builder
        run: docker buildx create --name leti-cook-release --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --use
      - name: Dry run with an ephemeral key and loopback registry
        run: |
          python -B tools/release_ci.py dry-run --bundle "$RUNNER_TEMP/release-bundle" \
            --output "$RUNNER_TEMP/release-dry-run" --builder leti-cook-release --registry-image "$REGISTRY_IMAGE"
      - name: Scan the exact dry-run OCI images
        run: |
          set -euo pipefail
          images="$RUNNER_TEMP/release-dry-run/images"
          for image in backend db; do
            docker run --rm --mount "type=bind,src=$images,dst=/images,readonly" \
              "$TRIVY_IMAGE" image --input "/images/$image" --no-progress --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          done
      - name: Remove this runner's builder
        if: always()
        run: |
          if docker buildx inspect leti-cook-release >/dev/null 2>&1; then
            docker buildx rm leti-cook-release
          fi
