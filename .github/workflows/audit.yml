name: Dependency audit
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      # pip-audit and every package it needs are pinned by version and hash.
      - name: Install the hash-locked audit tool
        run: |
          python -m pip install --require-hashes --no-deps -r tools/requirements-audit.lock
          python -m pip check
      - name: Audit the locked backend dependencies
        run: pip-audit -r application/requirements.lock --require-hashes --disable-pip
      - name: Audit the optional MCP adapter dependencies
        run: pip-audit -r tests/mcp_reference/requirements.lock --require-hashes --disable-pip
      - name: Audit the dependencies of the audit tool
        run: pip-audit -r tools/requirements-audit.lock --require-hashes --disable-pip
      - name: Audit the shipped frontend dependencies
        run: npm --prefix application/frontend audit --omit=dev --audit-level=high
      # The whole lock, including vite and the other tools that build the shipped web app.
      - name: Audit the tools that build the shipped frontend
        run: npm --prefix application/frontend audit --audit-level=critical
