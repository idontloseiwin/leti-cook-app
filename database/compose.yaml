# Local database transport only; this does not install or authorize the app.
# PostgreSQL is private to the installation; only the backend publishes a port.
# Supply a NEW, unique project name and an explicitly generated empty schema.
# Do not point this stack at a private volume, dump, or migration-history folder.
# All secrets are mandatory. Use ops/self_hosted_credentials.py; never commit
# its env file or print `docker compose config` with real credentials loaded.
name: ${SELF_HOSTED_DB_PROJECT:?Choose a new isolated database project name}

services:
  db:
    # Compose gives the locally built image this installation's project tag.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: leti-cook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provide a new database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?Provide a new URL-safe authenticator password}
      SELF_HOSTED_SCHEMA_SHA256: ${SELF_HOSTED_SCHEMA_SHA256:?Provide the schema SHA256 from the verified generated manifest}
    command:
      - postgres
      - -c
      - logging_collector=off
      - -c
      - log_destination=stderr
      - -c
      - log_statement=none
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - database-data:/var/lib/postgresql/data
      - type: bind
        source: ./bootstrap.sh
        target: /docker-entrypoint-initdb.d/10-self-hosted.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SELF_HOSTED_SCHEMA_PATH:?Provide the absolute path to the generated fresh schema SQL}
        target: /opt/leti-cook/schema.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # TCP excludes the temporary init server. The marker excludes a failed
      # first initialization on later restarts; never repair it by importing data.
      test: [CMD-SHELL, 'test -f "$$PGDATA/.self-hosted-schema-ready" && pg_isready -h 127.0.0.1 -U postgres -d leti-cook']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s
    # PostgreSQL errors can still contain source data. Disabling the persistent
    # Docker sink is essential; terse/error settings alone do not sanitize them.
    logging:
      driver: none
    networks: [database]

volumes:
  # Compose scopes this volume to SELF_HOSTED_DB_PROJECT; no external volume.
  database-data:

networks:
  database:
    internal: true
  application-access:
    driver: bridge
