# Obsolete compatibility fixture only; not shipped or started by direct PostgreSQL releases.
# Backend-only local Supabase SDK compatibility: /rest/v1 -> PostgREST.
# No Auth, Studio, Storage, Realtime, or public browser/user-export surface.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream database_rest {
        zone database_rest 64k;
        server rest:3000 resolve;
    }

    server {
        listen 8080;
        # No persistent request/response buffering; any unavoidable temporary
        # files live only in the container's bounded /tmp tmpfs.
        proxy_request_buffering off;
        proxy_buffering off;
        # PostgREST echoes the query in Content-Location. A 500-video IN filter
        # exceeds the default 4k response-header buffer even without body buffering.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;

        # Liveness only; authenticated database readiness is checked separately.
        location = /healthz {
            return 204;
        }

        location = /rest/v1 {
            proxy_pass http://database_rest/;
        }
        location /rest/v1/ {
            proxy_pass http://database_rest/;
        }
        location / {
            return 404;
        }
    }
}
